name: Robot Pabrik DevOps

on:
  push:
    branches:
      - main

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repo
        uses: actions/checkout@v3

      - name: Rakit Kontainer Docker (Nginx)
        run: |
          echo "Mulai merakit Docker Image..."
          docker build -t jatelindo-monitoring:v1 .
          echo "Docker Image berhasil dirakit!"
          
      - name: Verifikasi Hasil Rakitan
        run: docker images
