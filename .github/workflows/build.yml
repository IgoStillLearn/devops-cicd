name: Robot Pabrik DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repo
        uses: actions/checkout@v3

      - name: Login ke Gudang Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Rakit Kontainer Docker (Nginx)
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/jatelindo-monitoring:v3 .
          
      - name: Kirim Kontainer ke Gudang Awan
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/jatelindo-monitoring:v3
